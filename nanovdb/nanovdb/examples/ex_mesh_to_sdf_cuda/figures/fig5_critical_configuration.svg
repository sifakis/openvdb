<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 672" width="940" height="672" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The critical configuration</title><rect width="940" height="672" fill="#ffffff"/><defs><pattern id="hh" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="10" stroke="#cbd5e1" stroke-width="1.6"/></pattern></defs><rect x="20.00" y="500.00" width="900.00" height="78.00" rx="0" fill="url(#hh)" fill-opacity="1.0"/><circle cx="341.26" cy="278.31" r="221.69" fill="#f59e0b" fill-opacity="0.1" stroke="#b45309" stroke-width="2.4"/><circle cx="272.55" cy="401.92" r="98.08" fill="#3b82f6" fill-opacity="0.13" stroke="#2563eb" stroke-width="2.4"/><line x1="20.00" y1="500.00" x2="920.00" y2="500.00" stroke="#0f172a" stroke-width="3.4" stroke-opacity="1.0" stroke-linecap="butt"/><text x="908.00" y="486.00" font-size="22" fill="#0f172a" text-anchor="end" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" font-style="italic">Σ</text><line x1="272.55" y1="401.92" x2="272.55" y2="500.00" stroke="#2563eb" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="butt" stroke-dasharray="5 4"/><line x1="300.00" y1="498.08" x2="272.55" y2="401.92" stroke="#0f172a" stroke-width="1.7" stroke-opacity="1.0" stroke-linecap="butt" stroke-dasharray="7 5"/><circle cx="272.55" cy="401.92" r="6.50" fill="#2563eb" fill-opacity="1"/><circle cx="272.55" cy="500.00" r="4.50" fill="#0f172a" fill-opacity="1"/><line x1="341.26" y1="278.31" x2="341.26" y2="500.00" stroke="#b45309" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="butt" stroke-dasharray="5 4"/><line x1="300.00" y1="498.08" x2="341.26" y2="278.31" stroke="#0f172a" stroke-width="1.7" stroke-opacity="1.0" stroke-linecap="butt" stroke-dasharray="7 5"/><circle cx="341.26" cy="278.31" r="6.50" fill="#b45309" fill-opacity="1"/><circle cx="341.26" cy="500.00" r="4.50" fill="#0f172a" fill-opacity="1"/><circle cx="300.00" cy="498.08" r="5.50" fill="#dc2626" fill-opacity="1"/><text x="258.55" y="391.92" font-size="17" fill="#2563eb" text-anchor="end" font-weight="600" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >(1,0)</text><text x="258.55" y="411.92" font-size="13" fill="#475569" text-anchor="end" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >d₀ = 0.98080</text><text x="357.26" y="270.31" font-size="17" fill="#b45309" text-anchor="start" font-weight="600" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >(2,1)</text><text x="357.26" y="290.31" font-size="13" fill="#475569" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >d₀ = 2.21687</text><text x="288.00" y="488.08" font-size="17" fill="#dc2626" text-anchor="end" font-weight="600" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >v₁</text><line x1="272.55" y1="540.00" x2="341.26" y2="540.00" stroke="#0f766e" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="butt"/><line x1="272.55" y1="504.00" x2="272.55" y2="547.00" stroke="#0f766e" stroke-width="1.3" stroke-opacity="1.0" stroke-linecap="butt" stroke-dasharray="4 3"/><circle cx="272.55" cy="540.00" r="3.50" fill="#0f766e" fill-opacity="1"/><line x1="300.00" y1="504.00" x2="300.00" y2="547.00" stroke="#0f766e" stroke-width="1.3" stroke-opacity="1.0" stroke-linecap="butt" stroke-dasharray="4 3"/><circle cx="300.00" cy="540.00" r="3.50" fill="#0f766e" fill-opacity="1"/><line x1="341.26" y1="504.00" x2="341.26" y2="547.00" stroke="#0f766e" stroke-width="1.3" stroke-opacity="1.0" stroke-linecap="butt" stroke-dasharray="4 3"/><circle cx="341.26" cy="540.00" r="3.50" fill="#0f766e" fill-opacity="1"/><text x="260.55" y="546.00" font-size="13" fill="#0f766e" text-anchor="end" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >p = −0.2745</text><text x="353.26" y="546.00" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >p = +0.4126</text><text x="300.00" y="528.00" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >feet straddle the target's foot</text><circle cx="728.00" cy="300.00" r="158.00" fill="#fff" fill-opacity="1" stroke="#e2e8f0" stroke-width="1.6"/><clipPath id="ic"><circle cx="728" cy="300" r="156"/></clipPath><g clip-path="url(#ic)"><circle cx="1800.9" cy="-5413.9" r="5763.8" fill="#f59e0b" fill-opacity="0.12" stroke="#b45309" stroke-width="2.6"/><circle cx="14.4" cy="-2200.1" r="2550.1" fill="#3b82f6" fill-opacity="0.12" stroke="#2563eb" stroke-width="2.6"/><line x1="570" y1="349.9" x2="886" y2="349.9" stroke="#0f172a" stroke-width="3"/><circle cx="728" cy="300" r="49.9" fill="#dc2626" fill-opacity="0.28" stroke="#dc2626" stroke-width="2.4"/></g><circle cx="728.00" cy="300.00" r="4.00" fill="#dc2626" fill-opacity="1"/><circle cx="714.30" cy="251.99" r="8.00" fill="none" fill-opacity="1.0" stroke="#dc2626" stroke-width="2.2"/><line x1="714.30" y1="251.99" x2="649.40" y2="199.99" stroke="#2563eb" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="butt"/><text x="596.30" y="193.99" font-size="12" fill="#2563eb" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >tangent to (1,0)</text><circle cx="737.21" cy="250.93" r="8.00" fill="none" fill-opacity="1.0" stroke="#dc2626" stroke-width="2.2"/><line x1="737.21" y1="250.93" x2="755.91" y2="174.93" stroke="#b45309" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="butt"/><text x="771.21" y="168.93" font-size="12" fill="#b45309" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >tangent to (2,1)</text><text x="728.00" y="126.00" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600"  >magnified 26× about v₁</text><text x="728.00" y="375.93" font-size="15" fill="#475569" text-anchor="middle" font-weight="normal"  >Σ</text><text x="728.00" y="480.00" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal"  >the witness balls are 51× and 115× larger,</text><text x="728.00" y="498.00" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal"  >so at this zoom they look straight</text><rect x="24.00" y="62.00" width="252.00" height="130.00" rx="8" fill="#fff" fill-opacity="1.0" stroke="#e2e8f0" stroke-width="1.5"/><text x="42.00" y="90.00" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600"  >α* = 15.930625116297946°</text><text x="42.00" y="114.00" font-size="13" fill="#475569" text-anchor="start" font-weight="normal"  >cos α* + sin α* = √5 − 1</text><text x="42.00" y="144.00" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600"  >g((1,0)) = g((2,1)) = ε*</text><text x="42.00" y="168.00" font-size="13" fill="#dc2626" text-anchor="start" font-weight="normal"  >slack d₀ + ε* − |w| = 0, both</text><text x="24.00" y="34.00" font-size="18" fill="#0f172a" text-anchor="start" font-weight="600"  >5.  The critical configuration: three circles on a line, mutually tangent</text><text x="24.00" y="626.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >Drawn in the frame where Σ is horizontal. Every ball is tangent to Σ by construction; at α* the target ball is ALSO tangent to both</text><text x="24.00" y="648.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >witness balls at once. Their feet straddle the target's foot — the geometric signature of the crossover.</text></svg>