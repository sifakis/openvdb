dle" font-weight="normal"  >0.05</text><rect x="217.56" y="148.00" width="49.56" height="26.00" rx="4" fill="#dc2626" fill-opacity="0.22"/><line x1="217.56" y1="148.00" x2="217.56" y2="174.00" stroke="#dc2626" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="butt"/><line x1="267.12" y1="148.00" x2="267.12" y2="174.00" stroke="#dc2626" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="butt"/><text x="154.00" y="167.00" font-size="15" fill="#dc2626" text-anchor="end" font-weight="600"  >(2, 2, 1)</text><text x="840.00" y="167.00" font-size="12" fill="#475569" text-anchor="start" font-weight="normal"  >|w| = 3.0000   top: band</text><rect x="675.45" y="186.00" width="152.55" height="26.00" rx="4" fill="#2563eb" fill-opacity="0.22"/><line x1="675.45" y1="186.00" x2="675.45" y2="212.00" stroke="#2563eb" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="butt"/><line x1="828.00" y1="186.00" x2="828.00" y2="212.00" stroke="#2563eb" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="butt"/><text x="154.00" y="205.00" font-size="15" fill="#2563eb" text-anchor="end" font-weight="normal"  >(2, 1, 1)</text><text x="840.00" y="205.00" font-size="12" fill="#475569" text-anchor="start" font-weight="normal"  >|w| = 2.4495   top: band</text><rect x="675.45" y="224.00" width="152.55" height="26.00" rx="4" fill="#2563eb" fill-opacity="0.22"/><line x1="675.45" y1="224.00" x2="675.45" y2="250.00" stroke="#2563eb" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="butt"/><line x1="828.00" y1="224.00" x2="828.00" y2="250.00" stroke="#2563eb" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="butt"/><text x="154.00" y="243.00" font-size="15" fill="#2563eb" text-anchor="end" font-weight="normal"  >(1, 1, 1)</text><text x="840.00" y="243.00" font-size="12" fill="#475569" text-anchor="start" font-weight="normal"  >|w| = 1.7321   top: r_d</text><rect x="675.45" y="262.00" width="152.55" height="26.00" rx="4" fill="#2563eb" fill-opacity="0.22"/><line x1="675.45" y1="262.00" x2="675.45" y2="288.00" stroke="#2563eb" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="butt"/><line x1="828.00" y1="262.00" x2="828.00" y2="288.00" stroke="#2563eb" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="butt"/><text x="154.00" y="281.00" font-size="15" fill="#2563eb" text-anchor="end" font-weight="normal"  >(1, 1, 0)</text><text x="840.00" y="281.00" font-size="12" fill="#475569" text-anchor="start" font-weight="normal"  >|w| = 1.4142   top: r_d</text><rect x="168.00" y="322.00" width="49.56" height="30.00" rx="4" fill="#0f172a" fill-opacity="0.16"/><rect x="267.12" y="322.00" width="408.33" height="30.00" rx="4" fill="#0f172a" fill-opacity="0.16"/><text x="154.00" y="343.00" font-size="15" fill="#0f172a" text-anchor="end" font-weight="600"  >UNCERTIFIED</text><line x1="675.45" y1="314.00" x2="675.45" y2="362.00" stroke="#dc2626" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="butt"/><text x="687.45" y="378.00" font-size="15" fill="#dc2626" text-anchor="start" font-weight="600"  >ε* = 0.038443424</text><text x="241.92" y="380.00" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="normal"  >the hole</text><path d="M 241.9 368.0 L 241.9 354.0" fill="none" fill-opacity="1.0" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><rect x="24.00" y="384.00" width="416.00" height="122.00" rx="8" fill="#fff" fill-opacity="1.0" stroke="#e2e8f0" stroke-width="1.5"/><text x="42.00" y="412.00" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600"  >(2,2,1) has |w| = 3 = W exactly</text><text x="42.00" y="438.00" font-size="13" fill="#475569" text-anchor="start" font-weight="normal"  >so its window top is W − w·n = |w| − w·n = 2g:</text><text x="42.00" y="462.00" font-size="13" fill="#475569" text-anchor="start" font-weight="normal"  >a sliver (g, 2g] = (0.003755, 0.007509].</text><text x="42.00" y="490.00" font-size="13" fill="#dc2626" text-anchor="start" font-weight="normal"  >The threshold rule would call it usable for ALL ε &gt; g.</text><text x="24.00" y="34.00" font-size="18" fill="#0f172a" text-anchor="start" font-weight="600"  >2.  The (2,2,1) mechanism: a witness whose usable window is a sliver</text><text x="24.00" y="552.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >Each bar is J_w, the set of target depths that witness w can certify. Under the EXACT rule the bar is bounded above, because a deeper</text><text x="24.00" y="574.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >target pushes the witness out of the top of the band. The union is not upward closed, so the uncertified set is TWO intervals.</text></svg>