<text x="860" y="370" font-size="12" fill="#222">Zoom ×6.7 on the window (square is 0.80 voxel wide).</text>
<text x="860" y="387" font-size="12" fill="#222">Window (red) 0.32 voxel wide; lens 0.009 voxel thick.</text>
<text x="860" y="404" font-size="12" fill="#222">Orange: ellipse E, here only 0.32 voxel</text>
<text x="860" y="421" font-size="12" fill="#222">across and free of lattice points.</text>
<circle cx="50" cy="564" r="5.5" fill="#2e7d32" stroke="black" stroke-width="0.8"/>
<text x="66" y="568" font-size="13">certified, non-barrier (udf ≥ 0.55): the 4-connected seed component</text>
<circle cx="50" cy="586" r="5.5" fill="#81c784" stroke="black" stroke-width="0.8"/>
<text x="66" y="590" font-size="13">certified by the sweep, barrier (udf &lt; 0.55)</text>
<circle cx="50" cy="608" r="5.5" fill="white" stroke="#d32f2f" stroke-width="2"/>
<text x="66" y="612" font-size="13">truly outside, NOT certified at the fixpoint of any stencil shorter than |w|² = 34 (the pocket)</text>
<circle cx="50" cy="630" r="7" fill="#d32f2f" stroke="black" stroke-width="1.2"/>
<text x="66" y="634" font-size="13">q: the only pocket point any certified ball overlaps</text>
<circle cx="50" cy="652" r="2.3" fill="#777"/>
<text x="66" y="656" font-size="13">lattice point inside the solid</text>
<text x="40" y="696" font-size="12.5" fill="#222">Fixpoint, stencil |w| &lt; W + D (|w|² ≤ 10, the 2D analogue of the 146-tap stencil), or any stencil up to |w|² ≤ 32: 40/65 certified after 2 sweeps;</text>
<text x="40" y="715" font-size="12.5" fill="#222">none of the 25 pocket points, a whole non-barrier component, is ever entered. With |w|² ≥ 34: n certifies q (2.99+2.85 = 5.84 &gt; 5.831), then the pocket floods (65/65).</text>
<text x="40" y="734" font-size="12.5" fill="#222">Why nothing shorter works: (n, q) is the only ball pair that overlaps through the window. Any lattice x in E = {|x-n|+|x-q| &lt; 5.84} would bridge</text>
<text x="40" y="753" font-size="12.5" fill="#222">n→x→q with shorter hops, but E holds no lattice point other than n and q (that needs udf(n)+udf(q) &gt; 5.8416, via (2,1) or (3,2)).</text>
<text x="40" y="772" font-size="12.5" fill="#222">Why the W + D bound does not apply: it assumes every exterior non-barrier point is certified before the sweep; the pocket's are not, and promotion cannot help</text>
<text x="40" y="791" font-size="12.5" fill="#222">before one of them is certified. The price: the pocket hangs on a 0.32-voxel window, a sub-voxel neck.</text>
</svg>