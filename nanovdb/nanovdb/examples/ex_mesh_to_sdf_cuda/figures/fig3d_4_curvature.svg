41.652 305.284 L 559.478 304.371 L 577.304 303.534 L 595.130 302.767 L 612.957 302.065 L 630.783 301.421 L 648.609 300.831 L 666.435 300.290 L 684.261 299.794 L 702.087 299.340 L 719.913 298.924 L 737.739 298.543 L 755.565 298.193 L 773.391 297.873 L 791.217 297.580 L 809.043 297.311 L 826.870 297.064 L 844.696 296.838 L 862.522 296.631 L 880.348 296.442 L 898.174 296.268 L 916.000 296.109" fill="none" fill-opacity="1.0" stroke="#0f766e" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="5 5"/><text x="122.55" y="163.69" font-size="15" fill="#dc2626" text-anchor="start" font-weight="600" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >concave, exact</text><text x="287.51" y="248.87" font-size="13" fill="#dc2626" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >first order  ε* + K/R</text><text x="136.96" y="328.56" font-size="15" fill="#0f766e" text-anchor="start" font-weight="600" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >convex, exact</text><text x="193.35" y="372.52" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >first order  ε* − K/R</text><circle cx="304.53" cy="246.14" r="5.50" fill="#dc2626" fill-opacity="1"/><text x="316.53" y="266.14" font-size="13" fill="#dc2626" text-anchor="start" font-weight="600" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >+50.7%</text><circle cx="200.27" cy="128.91" r="5.50" fill="#dc2626" fill-opacity="1"/><text x="212.27" y="148.91" font-size="13" fill="#dc2626" text-anchor="start" font-weight="600" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >+158%</text><text x="24.00" y="34.00" font-size="18" fill="#0f172a" text-anchor="start" font-weight="600"  >4.  Curvature in 3D: K = 0.0635, about 2.2× the 2D value</text><text x="24.00" y="486.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >Exact law ε_thr(w) = g/(1 ∓ d₀/R), identical in form to 2D. A phase-1 table published the first-order model as if it were exact and</text><text x="24.00" y="508.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >understated the concave penalty by up to 3.7×; both referees caught it. True excesses: +50.7% at R = 5, +158% at R = 3.</text><text x="24.00" y="530.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >The convex branch does NOT saturate — it goes to zero linearly, ε*(R) → R·tan²(δ/2) with δ = 17.6532° the angular covering radius,</text><text x="24.00" y="552.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >because as R → 0 the length weighting vanishes and only the angle survives.</text></svg>