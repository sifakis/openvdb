nd" >concave, exact</text><text x="206.48" y="205.25" font-size="13" fill="#dc2626" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >first order  ε* + K/R</text><text x="137.99" y="322.46" font-size="15" fill="#0f766e" text-anchor="start" font-weight="600" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >convex, exact — saturates</text><text x="151.20" y="371.87" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >first order  ε* − K/R</text><text x="24.00" y="34.00" font-size="18" fill="#0f172a" text-anchor="start" font-weight="600"  >7.  Concave curvature costs; convex helps, but only up to a point</text><text x="24.00" y="486.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >Exact (solid): ε_thr(w) = g/(1 ∓ d₀/R). First order (dashed): ε* ± K/R with K = 0.0283152. The linear form is good to R ≈ 20 but understates</text><text x="24.00" y="508.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >concave damage by 3.2× at R = 2 — and on the convex side it wrongly predicts free certification at R = 1.47. The exact convex value</text><text x="24.00" y="530.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >flattens near 0.53·ε* and never reaches zero. Size any safety factor from the tightest CONCAVE feature radius.</text></svg>