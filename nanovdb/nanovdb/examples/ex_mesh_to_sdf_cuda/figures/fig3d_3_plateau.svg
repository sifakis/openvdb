" y2="336.63" stroke="#0f172a" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="butt"/><line x1="588.81" y1="336.17" x2="588.89" y2="336.63" stroke="#0f172a" stroke-width="1.4300000000000002" stroke-opacity="0.5" stroke-linecap="butt" stroke-dasharray="3 3"/><line x1="642.35" y1="345.05" x2="777.07" y2="345.05" stroke="#0f172a" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="butt"/><line x1="642.35" y1="336.63" x2="642.35" y2="345.05" stroke="#0f172a" stroke-width="1.4300000000000002" stroke-opacity="0.5" stroke-linecap="butt" stroke-dasharray="3 3"/><line x1="777.07" y1="356.54" x2="843.35" y2="356.54" stroke="#0f172a" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="butt"/><line x1="777.07" y1="345.05" x2="777.07" y2="356.54" stroke="#0f172a" stroke-width="1.4300000000000002" stroke-opacity="0.5" stroke-linecap="butt" stroke-dasharray="3 3"/><line x1="843.35" y1="358.92" x2="916.73" y2="358.92" stroke="#0f172a" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="butt"/><line x1="843.35" y1="356.54" x2="843.35" y2="358.92" stroke="#0f172a" stroke-width="1.4300000000000002" stroke-opacity="0.5" stroke-linecap="butt" stroke-dasharray="3 3"/><line x1="399.27" y1="84.00" x2="399.27" y2="400.00" stroke="#dc2626" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="butt"/><text x="409.27" y="106.00" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="600"  >W = 3</text><circle cx="399.27" cy="289.56" r="6.00" fill="#0f172a" fill-opacity="1"/><text x="411.27" y="277.56" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >0.0384434 (exact)</text><circle cx="399.27" cy="294.68" r="5.00" fill="#7c3aed" fill-opacity="1"/><text x="411.27" y="316.68" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >0.0366623 (threshold)</text><line x1="716.00" y1="100.00" x2="756.00" y2="100.00" stroke="#0f172a" stroke-width="3.4" stroke-opacity="1.0" stroke-linecap="butt"/><text x="764.00" y="105.00" font-size="13" fill="#0f172a" text-anchor="start" font-weight="normal"  >exact rule (the pipeline)</text><line x1="716.00" y1="124.00" x2="756.00" y2="124.00" stroke="#7c3aed" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="butt"/><text x="764.00" y="129.00" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="normal"  >threshold rule</text><text x="24.00" y="34.00" font-size="18" fill="#0f172a" text-anchor="start" font-weight="600"  >3.  ε*(W) in 3D: a staircase with ramps, and the two rules on different plateaus at W = 3</text><text x="24.00" y="486.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >Dashed segments are transitions — 3D is far rampier than 2D, which was mostly clean jumps. Under the EXACT rule the scheme gives no</text><text x="24.00" y="508.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >guarantee at all below W = 1 + r_d = 1.8660 (red band), yet the threshold rule reports finite constants there — optimistic by an</text><text x="24.00" y="530.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >unbounded factor. At W = 3 the threshold plateau floor is only 2.01×10⁻⁴ below: a knife edge. The exact rule has 16% margin below,</text><text x="24.00" y="552.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >but only 1.03% above.</text></svg>