<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" width="940" height="660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The pairwise rule and its marginal case</title><rect width="940" height="660" fill="#ffffff"/><defs><pattern id="hh" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="10" stroke="#cbd5e1" stroke-width="1.6"/></pattern></defs><rect x="20.00" y="520.00" width="900.00" height="56.00" rx="0" fill="url(#hh)" fill-opacity="1.0"/><line x1="20.00" y1="520.00" x2="920.00" y2="520.00" stroke="#0f172a" stroke-width="3.4" stroke-opacity="1.0" stroke-linecap="butt"/><text x="908.00" y="506.00" font-size="22" fill="#0f172a" text-anchor="end" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" font-style="italic">Σ</text><text x="30.00" y="556.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >solid</text><text x="30.00" y="118.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >exterior</text><circle cx="410.00" cy="310.00" r="210.00" fill="#3b82f6" fill-opacity="0.11" stroke="#2563eb" stroke-width="2.4"/><circle cx="200.00" cy="467.50" r="52.50" fill="#f59e0b" fill-opacity="0.2" stroke="#b45309" stroke-width="2.4"/><line x1="200.00" y1="467.50" x2="200.00" y2="520.00" stroke="#b45309" stroke-width="2" stroke-opacity="1.0" stroke-linecap="butt" stroke-dasharray="5 4"/><line x1="410.00" y1="310.00" x2="410.00" y2="520.00" stroke="#2563eb" stroke-width="2" stroke-opacity="1.0" stroke-linecap="butt" stroke-dasharray="5 4"/><line x1="200.00" y1="467.50" x2="410.00" y2="310.00" stroke="#0f172a" stroke-width="2" stroke-opacity="1.0" stroke-linecap="butt" stroke-dasharray="7 5"/><circle cx="242.00" cy="436.00" r="13.00" fill="none" fill-opacity="1.0" stroke="#dc2626" stroke-width="2.2"/><circle cx="242.00" cy="436.00" r="6.00" fill="#dc2626" fill-opacity="1"/><path d="M 242.0 436.0 L 324.0 318.0 L 370.0 318.0" fill="none" fill-opacity="1.0" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="378.00" y="314.00" font-size="14" fill="#dc2626" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >the balls merely touch —</text><text x="378.00" y="334.00" font-size="14" fill="#dc2626" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >the strict rule fails, by zero</text><path d="M 410.0 366.0 A 56 56 0 0 1 365.2 343.6" fill="none" fill-opacity="1.0" stroke="#7c3aed" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="376.01" y="384.98" font-size="23" fill="#7c3aed" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" font-style="italic">θ</text><circle cx="200.00" cy="467.50" r="6.50" fill="#b45309" fill-opacity="1"/><circle cx="410.00" cy="310.00" r="6.50" fill="#2563eb" fill-opacity="1"/><circle cx="200.00" cy="520.00" r="4.50" fill="#0f172a" fill-opacity="1"/><circle cx="410.00" cy="520.00" r="4.50" fill="#0f172a" fill-opacity="1"/><text x="184.00" y="459.50" font-size="20" fill="#b45309" text-anchor="end" font-weight="600" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >v₁</text><text x="184.00" y="479.50" font-size="13" fill="#475569" text-anchor="end" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >target</text><text x="426.00" y="304.00" font-size="20" fill="#2563eb" text-anchor="start" font-weight="600" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >v₀ = v₁ + w</text><text x="426.00" y="324.00" font-size="13" fill="#475569" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >witness (already certified)</text><text x="210.00" y="498.75" font-size="16" fill="#b45309" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >d₁ = ε</text><text x="422.00" y="449.00" font-size="16" fill="#2563eb" text-anchor="start" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >d₀ = ε + w·n</text><text x="331.00" y="408.75" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="normal" style="paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round" >|w|</text><text x="192.00" y="542.00" font-size="15" fill="#0f172a" text-anchor="end" font-weight="normal"  >P₁</text><text x="420.00" y="542.00" font-size="15" fill="#0f172a" text-anchor="start" font-weight="normal"  >P₀</text><rect x="596.00" y="60.00" width="324.00" height="222.00" rx="8" fill="#fff" fill-opacity="1.0" stroke="#e2e8f0" stroke-width="1.5"/><text x="614.00" y="90.00" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600"  >The rule, and its reduction</text><text x="614.00" y="120.00" font-size="17" fill="#0f172a" text-anchor="start" font-weight="600"  >d₁ + d₀ &gt; |w|</text><text x="614.00" y="146.00" font-size="13" fill="#475569" text-anchor="start" font-weight="normal"  >Substitute d₀ = ε + w·n and d₁ = ε:</text><text x="614.00" y="176.00" font-size="17" fill="#0f172a" text-anchor="start" font-weight="600"  >ε &gt; (|w| − w·n)/2</text><text x="614.00" y="204.00" font-size="17" fill="#0f172a" text-anchor="start" font-weight="600"  >  = |w|·sin²(θ/2)  =:  g(w,n)</text><line x1="610.00" y1="222.00" x2="906.00" y2="222.00" stroke="#e2e8f0" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="butt"/><text x="614.00" y="246.00" font-size="13" fill="#475569" text-anchor="start" font-weight="normal"  >θ = ∠P₀v₀v₁, at the witness, between</text><text x="614.00" y="266.00" font-size="13" fill="#475569" text-anchor="start" font-weight="normal"  >its normal drop and the target.</text><text x="24.00" y="34.00" font-size="18" fill="#0f172a" text-anchor="start" font-weight="600"  >1.  The certification rule, drawn at the exact margin</text><text x="24.00" y="616.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >Both balls are tangent to Σ — each radius IS its centre's true distance, so no ball can cross the surface. Certification asks whether the</text><text x="24.00" y="638.00" font-size="14" fill="#475569" text-anchor="start" font-weight="normal"  >two balls OVERLAP. Here they only touch: |w| = d₀ + d₁ exactly, with feet separated by dx = 2√(d₀d₁) = 2.</text></svg>