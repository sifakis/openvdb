<line x1="537.59" y1="277.47" x2="731.46" y2="212.85" stroke="#6a1b9a" stroke-width="2" marker-end="url(#ar)"/>
<text x="516.0" y="270.0" font-size="15" fill="black" text-anchor="start" font-weight="bold">n</text>
<text x="500.0" y="304.0" font-size="12" fill="black" text-anchor="start" font-weight="normal">udf = 2.55</text>
<text x="750.0" y="200.0" font-size="15" fill="black" text-anchor="start" font-weight="bold">q</text>
<text x="790.0" y="234.0" font-size="12" fill="black" text-anchor="start" font-weight="normal">udf = 0.65</text>
