<line x1="698.8" y1="223.7" x2="728.8" y2="285.7" stroke="#333" stroke-width="1"/>
<text x="731.8" y="299.7" font-size="12" fill="#333">window ≈ 0.39 voxel wide</text>
<text x="662.0" y="196.0" font-size="11" fill="#333" text-anchor="end">(2,1): 0.314 + 0.65 &lt; 1</text>
<text x="551.0" y="472.5" font-size="11" fill="#1565c0" text-anchor="start" font-weight="normal">reach-W disk around q (radius 3)</text>
<text x="628.0" y="301.0" font-size="12" fill="#e65100" text-anchor="middle" font-weight="normal">ellipse E (lattice-free)</text>
<text x="46.0" y="251.5" font-size="12" fill="#333" text-anchor="start" font-weight="normal">to the outside (seeds)</text>
<text x="285.0" y="458.5" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">solid (inside)</text>
<circle cx="50" cy="516" r="6" fill="#2e7d32" stroke="black" stroke-width="0.8"/>
<text x="66" y="520" font-size="13">certified, non-barrier (udf ≥ √2/2)</text>
<circle cx="50" cy="538" r="6" fill="#81c784" stroke="black" stroke-width="0.8"/>
<text x="66" y="542" font-size="13">certified, barrier (udf &lt; √2/2)</text>
<circle cx="50" cy="560" r="7" fill="#d32f2f" stroke="black" stroke-width="1.2"/>
<text x="66" y="564" font-size="13">q: truly outside, NOT certified at the reach-W fixpoint (certified with reach W+√2/2)</text>
<circle cx="50" cy="582" r="2.5" fill="#777"/>
<text x="66" y="586" font-size="13">lattice point inside the solid</text>
<text x="40" y="626" font-size="12.5" fill="#222">Fixpoint, reach |w| ≤ W = 3: 36/37 exterior band points certified after 5 sweeps (last sweep changes nothing); q is never certified.</text>
<text x="40" y="645" font-size="12.5" fill="#222">Fixpoint, reach |w| &lt; W+√2/2: 37/37 certified; q is certified directly from n (udf(n)+udf(q) = 3.20 &gt; |w| = 3.162).</text>
<text x="40" y="664" font-size="12.5" fill="#222">Why no short chain: n's ball is the only ball that overlaps q's. Any lattice x in the orange ellipse E = {|x-n|+|x-q| &lt; 3.20} would bridge n→x→q</text>
<text x="40" y="683" font-size="12.5" fill="#222">with both hops &lt; W, but E holds no lattice point except n and q (it would need udf(n)+udf(q) &gt; 1+√5 ≈ 3.236). Best short attempt: x = (2,1),</text>
<text x="40" y="702" font-size="12.5" fill="#222">udf 0.314 + 0.65 = 0.964 vs |x-q| = 1, margin -0.036. The price: q sits in a sub-voxel bubble behind a 0.39-voxel window.</text>
