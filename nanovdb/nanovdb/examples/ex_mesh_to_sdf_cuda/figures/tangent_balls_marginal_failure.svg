<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 800" width="980" height="800"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Marginal (tangent) case of the pairwise enrichment rule</title>
  <desc>A straight-line interface Sigma with two points v0 (deep witness) and v1 (near-interface
        target) on the same side. Their balls B(v0,d0) and B(v1,d1) are exactly tangent, so the
        strict rule d0 + d1 &gt; |v0 v1| fails by zero margin.</desc>

  <defs>
    <pattern id="solidHatch" width="11" height="11" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="11" height="11" fill="#f1f5f9"/>
      <line x1="0" y1="0" x2="0" y2="11" stroke="#cbd5e1" stroke-width="1.7"/>
    </pattern>
    <marker id="ahEnd" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="ahStart" viewBox="0 0 10 10" refX="1" refY="5"
            markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .halo  { paint-order: stroke; stroke: #ffffff; stroke-width: 4.5px; stroke-linejoin: round; }
      .lbl   { font-size: 17px; fill: #0f172a; }
      .big   { font-size: 22px; font-weight: 600; fill: #0f172a; }
      .note  { font-size: 15px; fill: #334155; }
      .faint { font-size: 14px; fill: #64748b; }
    </style>
  </defs>

  <rect width="980" height="800" fill="#ffffff"/>

  <text x="20" y="34" font-size="19" font-weight="600" fill="#0f172a">
    Marginal (tangent) case of the pairwise enrichment rule
  </text>

  <!-- solid / inside half-plane -->
  <rect x="20" y="620" width="940" height="175" fill="url(#solidHatch)"/>

  <!-- barrier band |udf| &lt;= sqrt(2)/2  (2D circumradius of a unit cell) -->
  <rect x="20" y="528" width="940" height="184" fill="#f43f5e" opacity="0.07"/>
  <line x1="20" y1="528" x2="960" y2="528" stroke="#f43f5e" stroke-width="1.4"
        stroke-dasharray="7 5" opacity="0.5"/>
  <line x1="20" y1="712" x2="960" y2="712" stroke="#f43f5e" stroke-width="1.4"
        stroke-dasharray="7 5" opacity="0.5"/>
  <text class="faint halo" x="952" y="521" text-anchor="end">barrier band |udf| &#8804; &#8730;2/2</text>

  <!-- the interface -->
  <line x1="20" y1="620" x2="960" y2="620" stroke="#0f172a" stroke-width="3.5"/>
  <text class="big halo" x="952" y="608" text-anchor="end" font-style="italic">&#931;</text>

  <text class="lbl halo" x="40" y="120" fill="#475569">outside (the &#931;-free side)</text>
  <text class="lbl halo" x="40" y="748" fill="#475569">inside (solid)</text>

  <!-- ball around the deep witness v0 -->
  <circle cx="340" cy="360" r="260" fill="#3b82f6" fill-opacity="0.10"
          stroke="#2563eb" stroke-width="2.5"/>
  <!-- ball around the near-interface target v1 -->
  <circle cx="600" cy="555" r="65" fill="#f59e0b" fill-opacity="0.20"
          stroke="#d97706" stroke-width="2.5"/>

  <!-- radii, each perpendicular to Sigma at its foot -->
  <line x1="340" y1="360" x2="340" y2="620" stroke="#2563eb" stroke-width="2"
        stroke-dasharray="6 4"/>
  <line x1="600" y1="555" x2="600" y2="620" stroke="#d97706" stroke-width="2"
        stroke-dasharray="6 4"/>
  <path d="M 328 620 L 328 608 L 340 608" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 612 620 L 612 608 L 600 608" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- the centre-to-centre segment -->
  <line x1="340" y1="360" x2="600" y2="555" stroke="#0f172a" stroke-width="2"
        stroke-dasharray="7 5"/>
  <g transform="translate(470,457.5) rotate(36.87)">
    <text class="lbl halo" x="0" y="-13" text-anchor="middle">|v&#8320;v&#8321;| = d&#8320; + d&#8321; = 2.5</text>
  </g>

  <!-- theta = angle P0-v0-v1, between the normal drop v0->P0 and the segment v0->v1 -->
  <path d="M 397.6 403.2 A 72 72 0 0 1 340 432" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
  <text class="halo" x="382" y="446" font-size="21" font-style="italic" fill="#7c3aed"
        text-anchor="middle">&#952;</text>

  <!-- feet on Sigma -->
  <circle cx="340" cy="620" r="4.5" fill="#0f172a"/>
  <circle cx="600" cy="620" r="4.5" fill="#0f172a"/>
  <text class="lbl halo" x="326" y="652" text-anchor="end">P&#8320;</text>
  <text class="lbl halo" x="616" y="652">P&#8321;</text>

  <!-- centres -->
  <circle cx="340" cy="360" r="6.5" fill="#1d4ed8"/>
  <circle cx="600" cy="555" r="6.5" fill="#b45309"/>
  <text class="big halo" x="340" y="336" text-anchor="middle">v&#8320;</text>
  <text class="faint halo" x="340" y="316" text-anchor="middle">deep witness (certified)</text>
  <text class="big halo" x="620" y="550">v&#8321;</text>
  <text class="faint halo" x="646" y="550">target</text>
  <text class="lbl halo" x="352" y="496">d&#8320; = 2</text>
  <text class="lbl halo" x="614" y="602">d&#8321; = 0.5</text>

  <!-- the single tangency point -->
  <circle cx="548" cy="516" r="14" fill="none" stroke="#dc2626" stroke-width="2"/>
  <circle cx="548" cy="516" r="6.5" fill="#dc2626"/>
  <path d="M 548 516 L 614 428 L 700 428" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <text class="lbl" x="708" y="423" fill="#b91c1c">T &#8212; the two balls touch at</text>
  <text class="lbl" x="708" y="445" fill="#b91c1c">exactly one point: no overlap</text>

  <!-- tangential separation of the two feet -->
  <line x1="340" y1="624" x2="340" y2="686" stroke="#0f766e" stroke-width="1.3"
        stroke-dasharray="5 4"/>
  <line x1="600" y1="624" x2="600" y2="686" stroke="#0f766e" stroke-width="1.3"
        stroke-dasharray="5 4"/>
  <line x1="340" y1="676" x2="600" y2="676" stroke="#0f766e" stroke-width="2.4"
        marker-start="url(#ahStart)" marker-end="url(#ahEnd)"/>
  <rect x="352" y="688" width="236" height="27" rx="5" fill="#ffffff" fill-opacity="0.92"/>
  <text class="lbl" x="470" y="707" text-anchor="middle" fill="#0f766e">
    dx = |P&#8320;P&#8321;| = 2&#8730;(d&#8320;d&#8321;) = 2
  </text>

  <!-- caption -->
  <rect x="655" y="70" width="305" height="300" rx="8" fill="#ffffff"
        stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="note" x="671" y="100" font-weight="600" fill="#0f172a">Break-even case</text>
  <text class="note" x="671" y="126">|v&#8320;v&#8321;| = d&#8320; + d&#8321; &#8212; exactly.</text>
  <text class="note" x="671" y="148">The enrichment rule demands</text>
  <text class="note" x="671" y="170">d&#8320; + d&#8321; &gt; |v&#8320;v&#8321;| (strict), so v&#8321; is</text>
  <text class="note" x="671" y="192">NOT certified: it fails by a</text>
  <text class="note" x="671" y="214">margin of exactly zero.</text>
  <line x1="671" y1="234" x2="944" y2="234" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="note" x="671" y="262" font-weight="600" fill="#7c3aed">
    &#952; = &#8736;P&#8320;v&#8320;v&#8321; (normal drop vs. v&#8320;v&#8321;)
  </text>
  <text class="note" x="671" y="288">sin &#952; = dx / (d&#8320; + d&#8321;)</text>
  <text class="note" x="671" y="310">cos &#952; = (d&#8320; &#8722; d&#8321;) / (d&#8320; + d&#8321;)</text>
  <text class="note" x="671" y="332">tan(&#952;/2) = &#8730;(d&#8321; / d&#8320;)</text>
  <text class="note" x="671" y="354">here: &#952; = 2&#183;arctan(&#189;) &#8776; 53.13&#176;</text>
</svg>
