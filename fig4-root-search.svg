<text x="530.0" y="114.5" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">face flag set by stages 1–3</text>
<rect x="506.0" y="128.0" width="16.0" height="16.0" fill="#b8601c"/>
<text x="514.0" y="140.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1</text>
<text x="530.0" y="140.5" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">added in round 1 (across</text>
<text x="530.0" y="155.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">flagged faces only)</text>
<rect x="506.0" y="168.0" width="16.0" height="16.0" fill="#b8601c"/>
<text x="514.0" y="180.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2</text>
<text x="530.0" y="180.5" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">added in round 2 (across</text>
<text x="530.0" y="195.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="normal">every face of round 1’s tiles)</text>
<text x="506.0" y="216.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">Round 3: no new tile, so the search ends.</text>
<text x="506.0" y="240.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">Neighbors that are entries, or tiles already</text>
<text x="506.0" y="256.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">added, are filtered out each round.</text>
<text x="506.0" y="288.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">A neighbor outside the hull is never added:</text>
<text x="506.0" y="304.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">propagate() throws once that round ends</text>
<text x="506.0" y="320.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">(the input breaks precondition 2 or 3).</text>
<text x="506.0" y="352.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">Returned: the added tiles’ origins, sorted.</text>
<text x="20.0" y="436.0" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">In 3D a tile is 4096³ voxels: stage 4 has work only when the interior includes a whole tile without a root-table entry.</text>
